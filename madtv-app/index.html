<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sendermanager-Simulation: Sendeplan füllen, Werbung verkaufen, Quote halten.">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mad TV — Der Sendermanager">
  <meta property="og:description" content="Sendeplan füllen, Werbung verkaufen, Quote halten — und Betty Botterbloom erobern.">
  <title>Mad TV — Der Sendermanager</title>
  <!-- Das Sinnbild steckt als Datenadresse in der Seite, damit auch die
       Einzeldatei-Fassung ohne Nebendateien auskommt. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cg stroke='%234aa3ff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='5' y='11' width='22' height='15' rx='2.5'/%3E%3Cpath d='m11.5 5.5 4.5 4.5 4.5-4.5'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <div id="start"></div>

  <div id="app">
    <header id="topbar"></header>
    <div id="world" aria-hidden="false"></div>
    <main id="main"><div class="wrap" id="view"></div></main>
    <!-- Das Armaturenbrett gehört zum Rahmen, nicht zum Raum: Der Raum darüber
         wechselt, das Brett bleibt stehen. -->
    <aside id="brett" aria-label="Sendezentrale"></aside>
    <nav id="bottom" aria-label="Etagen"></nav>
  </div>

  <!-- Meldungen erscheinen und verschwinden von selbst; ohne aria-live
       bekommt sie ein Vorleseprogramm nie zu hören. -->
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal"><div class="mbox" id="mbox"></div></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
