<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mad TV — Der Sendermanager</title>
<style>
:root{
  --bg:#0e1116;
  --bg2:#151a22;
  --panel:#1b212b;
  --panel2:#222a36;
  --line:#2e3846;
  --line2:#3b4757;
  --txt:#e6ebf2;
  --dim:#93a1b3;
  --dim2:#6b7a8d;
  --acc:#5aa9ff;
  --acc2:#7c5cff;
  --ok:#3ddc97;
  --warn:#ffc857;
  --bad:#ff6b6b;
  --gold:#f5c451;
  --love:#ff5d8f;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--txt);
  font-size:14px;
  line-height:1.45;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select{font:inherit;color:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;}

/* ─────────── Layout ─────────── */
#app{display:flex;flex-direction:column;height:100dvh;}

/* ─────────── Topbar ─────────── */
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--bg2);
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;flex-shrink:0;
}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px;white-space:nowrap;}
.brand span{color:var(--acc);}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.stat .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);}
.stat .v{font-size:13px;font-weight:700;white-space:nowrap;}
.stat.money .v{color:var(--ok);} .stat.money.neg .v{color:var(--bad);}
.stat.img .v{color:var(--acc);}
.stat.love .v{color:var(--love);}
.spacer{flex:1 1 auto;}
.speedbtns{display:flex;gap:3px;background:var(--panel);border-radius:8px;padding:3px;}
.speedbtns button{
  padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;color:var(--dim);
}
.speedbtns button.on{background:var(--acc);color:#04121f;}
.iconbtn{
  padding:5px 9px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);font-size:12px;color:var(--dim);
}
.iconbtn:hover{border-color:var(--line2);color:var(--txt);}

/* clock */
.clock{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:2px 10px;letter-spacing:.03em;
}
.clock.late{color:var(--warn);border-color:#4a3d1c;}
.clock.onair{color:var(--bad);}

/* ─────────── Main ─────────── */
#main{flex:1 1 auto;overflow:auto;position:relative;}
.wrap{max-width:1080px;margin:0 auto;padding:14px 12px 90px;}

/* ─────────── Tower ─────────── */
.tower{display:flex;gap:10px;align-items:stretch;}
.shaft{
  width:54px;flex-shrink:0;position:relative;
  background:linear-gradient(180deg,#11151c,#0d1116);
  border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;
}
.shaft .rail{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%);}
.cab{
  position:absolute;left:5px;right:5px;height:38px;
  background:linear-gradient(180deg,#33405280,#1f2732);
  border:1px solid var(--acc);border-radius:6px;
  transition:top .18s linear;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px rgba(90,169,255,.25);
}
.cab .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);}
.cab.moving .dot{animation:blink .5s infinite;}
@keyframes blink{50%{opacity:.2;}}
.floors{flex:1 1 auto;display:flex;flex-direction:column;gap:4px;}
.floor{
  height:42px;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:0 12px;cursor:pointer;
  transition:background .12s,border-color .12s,transform .12s;
}
.floor:hover{background:var(--panel2);border-color:var(--line2);}
.floor.here{border-color:var(--acc);background:#1b2634;}
.floor .num{
  font-size:10px;color:var(--dim2);width:20px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.floor .ico{font-size:17px;width:24px;text-align:center;}
.floor .nm{font-weight:600;font-size:13px;}
.floor .sub{font-size:10.5px;color:var(--dim2);margin-left:auto;text-align:right;}
.floor .badge{
  background:var(--bad);color:#fff;font-size:9px;font-weight:800;
  border-radius:20px;padding:1px 6px;margin-left:6px;
}

/* ─────────── Room screens ─────────── */
.room{animation:fade .16s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}}
.roomhead{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  padding-bottom:10px;border-bottom:1px solid var(--line);
}
.roomhead .ico{font-size:26px;}
.roomhead h2{font-size:18px;font-weight:800;letter-spacing:-.01em;}
.roomhead p{font-size:11.5px;color:var(--dim2);}
.backbtn{
  margin-left:auto;padding:6px 12px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;
}
.backbtn:hover{border-color:var(--acc);color:var(--acc);}

.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:10px;
}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:8px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}

.btn{
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;
  background:var(--acc);color:#04121f;transition:filter .12s;
}
.btn:hover{filter:brightness(1.12);}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:6px;}
.btn.danger{background:var(--bad);color:#2a0808;}
.btn.gold{background:var(--gold);color:#2a1e04;}
.btn.love{background:var(--love);color:#2d0713;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* lists */
.list{display:flex;flex-direction:column;gap:6px;max-height:none;}
.item{
  display:flex;align-items:center;gap:9px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;
  transition:border-color .12s,background .12s;
}
.item:hover{border-color:var(--line2);}
.item.sel{border-color:var(--acc);background:#1d2836;}
.item .t{font-weight:600;font-size:12.5px;}
.item .m{font-size:10.5px;color:var(--dim2);}
.item .r{margin-left:auto;text-align:right;flex-shrink:0;}
.tag{
  display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;
  border-radius:4px;background:var(--line);color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em;
}
.tag.g{background:#173a2b;color:var(--ok);}
.tag.w{background:#3d3117;color:var(--warn);}
.tag.b{background:#3d1b1b;color:var(--bad);}
.tag.a{background:#16304d;color:var(--acc);}
.tag.p{background:#2a1f4d;color:#b9a5ff;}

.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:44px;}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--acc);}
.statline{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim2);}

table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.tbl th{
  text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--dim2);padding:4px 6px;border-bottom:1px solid var(--line);font-weight:700;
}
table.tbl td{padding:5px 6px;border-bottom:1px solid #232b36;}
table.tbl tr:last-child td{border-bottom:none;}
.num{font-variant-numeric:tabular-nums;}
.right{text-align:right;}
.ok{color:var(--ok);} .bad{color:var(--bad);} .warn{color:var(--warn);}
.dim{color:var(--dim2);} .acc{color:var(--acc);}

/* ─────────── Schedule ─────────── */
.sched{display:flex;flex-direction:column;gap:5px;}
.slotrow{display:flex;gap:5px;align-items:stretch;}
.slotrow .hr{
  width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--dim2);background:var(--bg2);
  border:1px solid var(--line);border-radius:7px;font-variant-numeric:tabular-nums;
}
.slotrow .hr.prime{color:var(--gold);border-color:#4a3d1c;}
.slot{
  flex:1 1 auto;min-width:0;min-height:44px;
  background:var(--bg2);border:1px dashed var(--line2);border-radius:7px;
  padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;
  transition:border-color .12s,background .12s;
}
.slot:hover{border-color:var(--acc);}
.slot.filled{border-style:solid;background:var(--panel2);}
.slot.aired{opacity:.62;cursor:default;border-style:solid;}
.slot.adslot{flex:0 0 140px;}
@media(max-width:660px){.slot.adslot{flex:0 0 96px;}}
.slot .st{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slot .ss{font-size:9.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slot .empty{font-size:10.5px;color:var(--dim2);text-align:center;}
.slot.ok{border-color:#2b5c48;}
.slot.warn{border-color:#5c4c22;}
.slot.bad{border-color:#5c2b2b;}
.picking .slot{border-color:var(--acc);background:#16202c;}

.newsband{
  display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim2);
  background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;
}

/* ─────────── Bottom nav ─────────── */
#bottom{
  flex-shrink:0;display:flex;gap:6px;padding:8px 12px;
  background:var(--bg2);border-top:1px solid var(--line);
  overflow-x:auto;
}
#bottom button{
  flex:0 0 auto;padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);white-space:nowrap;
}
#bottom button:hover{border-color:var(--line2);color:var(--txt);}
#bottom button.on{border-color:var(--acc);color:var(--acc);}

/* ─────────── Modal ─────────── */
#modal{
  position:fixed;inset:0;z-index:300;background:rgba(6,9,13,.78);
  display:none;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);
}
#modal.on{display:flex;}
.mbox{
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  max-width:520px;width:100%;max-height:86vh;overflow:auto;
  padding:18px;animation:pop .18s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
@keyframes pop{from{transform:scale(.95);opacity:0;}}
.mbox .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mbox .mh .ico{font-size:28px;}
.mbox h3{font-size:16px;font-weight:800;}
.mbox .who{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;}
.mbox p{font-size:13px;color:var(--dim);margin-bottom:10px;}
.mbox .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;}

/* ─────────── Toasts ─────────── */
#toasts{position:fixed;right:12px;top:60px;z-index:310;display:flex;flex-direction:column;gap:6px;max-width:min(330px,84vw);}
.toast{
  background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--acc);
  border-radius:8px;padding:8px 11px;font-size:12px;
  animation:slidein .2s ease;box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.toast.good{border-left-color:var(--ok);}
.toast.bad{border-left-color:var(--bad);}
.toast.warn{border-left-color:var(--warn);}
.toast .tt{font-weight:700;font-size:11.5px;margin-bottom:1px;}
.toast .td{color:var(--dim);font-size:11px;}
@keyframes slidein{from{transform:translateX(22px);opacity:0;}}

/* ─────────── Start screen ─────────── */
#start{
  position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 50% 0%,#1b2436,#0b0e13 70%);
  display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;
}
#start .sbox{max-width:560px;width:100%;text-align:center;padding:20px 0;}
#start h1{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1;}
#start h1 span{color:var(--acc);}
#start .sub{color:var(--dim2);font-size:13px;margin:6px 0 22px;}
.optrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.opt{
  padding:9px 14px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--dim);
}
.opt.on{border-color:var(--acc);color:var(--acc);background:#182231;}
.opt small{display:block;font-size:10px;color:var(--dim2);font-weight:400;margin-top:1px;}
#start .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim2);margin-bottom:6px;}
#start input[type=text]{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;width:230px;text-align:center;font-size:13px;font-weight:600;
}
#start .go{
  margin-top:20px;padding:12px 34px;border-radius:11px;font-size:15px;font-weight:800;
  background:var(--acc);color:#04121f;
}
#start .foot{margin-top:18px;font-size:10.5px;color:var(--dim2);line-height:1.6;}

/* ─────────── Misc ─────────── */
.empty-note{color:var(--dim2);font-size:12px;text-align:center;padding:14px;}
.hint{font-size:11px;color:var(--dim2);margin-top:6px;line-height:1.5;}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
.kpi .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi .d{font-size:10.5px;color:var(--dim2);}
.chart{display:flex;align-items:flex-end;gap:3px;height:78px;padding-top:4px;}
.chart .col{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0;}
.chart .col i{display:block;border-radius:2px 2px 0 0;}
.chart .lab{font-size:8.5px;color:var(--dim2);text-align:center;margin-top:3px;}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--dim2);margin-top:6px;flex-wrap:wrap;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.pers{display:flex;gap:12px;align-items:center;}
.avatar{
  width:64px;height:64px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:34px;
  background:var(--panel2);border:1px solid var(--line2);
}
.avatar.betty{background:linear-gradient(160deg,#3a1830,#241426);border-color:#5c2e4a;}
.avatar.boss{background:linear-gradient(160deg,#2c2418,#1d1a12);border-color:#4d4128;}
.heart{color:var(--love);}

/* ─────────── Fokus & Bedienhilfen ─────────── */
:focus{outline:none;}
:focus-visible{
  outline:2px solid var(--acc);
  outline-offset:2px;
  border-radius:4px;
}
.floor:focus-visible,.slot:focus-visible,.item:focus-visible{outline-offset:1px;}
.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .cab{transition:none;}
}

/* ─────────── Trend & Zielgruppen ─────────── */
.trend{font-size:9.5px;font-weight:800;letter-spacing:.02em;}
.trend.up{color:var(--ok);} .trend.dn{color:var(--bad);} .trend.fl{color:var(--dim2);}
.grouprow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px;}
.grouprow .gn{width:104px;flex-shrink:0;color:var(--dim);}
.grouprow .gb{flex:1 1 auto;}
.grouprow .gv{width:74px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
.optline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;}
.optline+.optline{border-top:1px solid var(--line);}
.optline .ot{font-size:12.5px;font-weight:600;}
.optline .od{font-size:10.5px;color:var(--dim2);}
.toggle{
  width:44px;height:24px;border-radius:20px;background:var(--line);
  position:relative;flex-shrink:0;transition:background .15s;
}
.toggle.on{background:var(--acc);}
.toggle i{
  position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--txt);transition:left .15s;
}
.toggle.on i{left:23px;background:#04121f;}
</style>
</head>
<body>

<div id="start"></div>

<div id="app">
  <div id="topbar"></div>
  <div id="main"><div class="wrap" id="view"></div></div>
  <div id="bottom"></div>
</div>

<div id="toasts"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   MAD TV — Der Sendermanager
   Eine Hommage an "Mad TV" (Rainbow Arts, 1991).
   Eigenständige Nachbildung der Spielmechanik, eigene Inhalte.
   ═══════════════════════════════════════════════════════════════════ */

/* ─────────────── Hilfsfunktionen ─────────────── */
function rnd(){ return Math.random(); }
function ri(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)/4294967295; }
function money(n){
  const s = Math.abs(Math.round(n)).toLocaleString('de-DE');
  return (n<0?'−':'') + s + ' €';
}
function moneyShort(n){
  const a = Math.abs(n);
  if(a >= 1e6) return (n<0?'−':'') + (a/1e6).toFixed(a>=1e7?0:1).replace('.',',') + ' Mio €';
  if(a >= 1000) return (n<0?'−':'') + Math.round(a/1000) + 'k €';
  return money(n);
}
function viewers(n){
  if(n >= 1e6) return (n/1e6).toFixed(2).replace('.',',') + ' Mio';
  if(n >= 1000) return Math.round(n/1000) + '.000';
  return String(Math.round(n));
}
function pct(n,d){ return (n*100).toFixed(d===undefined?1:d).replace('.',',') + '%'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hhmm(min){
  const h = Math.floor(min/60)%24, m = min%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function el(id){ return document.getElementById(id); }

/* ═══════════════════════════════════════════════════════════════════
   TEIL 1 — STAMMDATEN
   ═══════════════════════════════════════════════════════════════════ */

/* ─── Zuschauer-Zielgruppen ───
   share  = Anteil an der Gesamtbevölkerung
   act    = Fernsehneigung je Sendeblock (18,19,20,21,22,23,0 Uhr)       */
const GROUPS = [
  { id:'kind', name:'Kinder',       ico:'🧒', share:0.11, act:[0.58,0.46,0.24,0.07,0.02,0.01,0.00] },
  { id:'teen', name:'Jugendliche',  ico:'🧑', share:0.14, act:[0.30,0.40,0.50,0.56,0.52,0.42,0.26] },
  { id:'haus', name:'Hausfrauen',   ico:'🧺', share:0.16, act:[0.46,0.56,0.60,0.54,0.38,0.24,0.09] },

let G = null;          // globaler Spielzustand
let UID = 1;
function uid(){ return UID++; }

/* ─── Lizenz aus Katalogzeile bauen ─── */
function makeLicence(line, isSerie){
  const p = line.split('|');
  const title = p[0], genre = p[1], year = +p[2], tier = +p[3];
  const eps = isSerie ? +p[4] : 0;
  const gd = GENRES[genre];
  const h1 = hash(title), h2 = hash(title+'k'), h3 = hash(title+'b');
  const qual   = clamp(Math.round(tier*15 - 6 + h1*24), 8, 97);
  const critic = clamp(Math.round(qual + gd.krit*38 + h2*24 - 12), 3, 99);
  const box    = clamp(Math.round(qual*0.62 + tier*7 + h3*20), 4, 99);
  let fsk = gd.fsk;
  if(h2 > 0.75 && fsk < 18) fsk = fsk===0?6:(fsk===6?12:(fsk===12?16:18));
  if(h3 > 0.9 && (genre==='horror'||genre==='action')) fsk = 18;
  let price = Math.round((qual*300 + box*160 + Math.max(0,year-1968)*1050) * (1 + tier*0.14) * 2.1);
  price = Math.round(price/1000)*1000;
  if(isSerie) price = Math.round(price * (0.45 + eps*0.055) /1000)*1000;
  return {
    uid: uid(), title, genre, year, tier, fsk, price,
    qual, critic, box,
    fresh: 1, aired: 0, lastDay: -99,
    isSerie: !!isSerie, eps, ep: 1, produced:false
  };
}

/* ─── Vollständiger Katalog (wird beim Start einmal gebaut) ─── */
function buildCatalog(){
  const all = [];
  FILM_DATA.forEach(l => all.push(makeLicence(l,false)));
  SERIE_DATA.forEach(l => all.push(makeLicence(l,true)));
  return all;
}

/* ─── Werbevertrag erzeugen ─── */
function makeContract(day, tierHint){
  const b = pick(BRANDS).split('|');
  const brand = b[0], product = b[1], gid = b[2];
  const useGroup = rnd() < 0.34;
  const tier = tierHint !== undefined ? tierHint : ri(1,6);
  const baseAud = [700000, 1400000, 2400000, 3600000, 5200000, 7400000][tier-1];
  const gi = GIDX[gid];
  let minAud, group = null;
  if(useGroup){
    group = gid;
    minAud = Math.round(baseAud * GROUPS[gi].share * 1.55 / 10000) * 10000;
  } else {
    minAud = Math.round(baseAud * (0.85 + rnd()*0.3) / 10000) * 10000;
  }
  const spots = ri(2,6);
  const days  = spots + ri(1,4);
  let perSpot = minAud * (useGroup ? 0.115 : 0.030) * (0.85 + rnd()*0.55);
  perSpot = Math.round(perSpot/500)*500;
  const penalty = Math.round(perSpot*spots*(0.55+rnd()*0.75)/1000)*1000;
  return {
    id: uid(), brand, product, group, gi,
    minAud, spots, done:0, days, deadline: day + days,
    perSpot, penalty, tier, added:day, owner:null
  };
}

/* ─── Nachrichtenmeldung erzeugen ─── */
function makeNews(res, day){
  const pool = HEADLINES[res];
  const txt = pool[Math.floor(rnd()*pool.length)];
  return {
    id: uid(), res, text: txt, day,
    weight: 0.55 + rnd()*0.65      // Nachrichtenwert
  };
}

/* ─── Sender ─── */
function makeChannel(name, isAI, startMoney, aiSkill){
  return {
    name, isAI, money:startMoney, credit:0,
    licences: [], contracts: [],
    sched: {},                       // sched[day] = [{prog, ad, aired, res}, …]
    newsSub:    { pol:0, spo:0, sho:0, sen:0, tec:0 },
    newsSubMax: { pol:0, spo:0, sho:0, sen:0, tec:0 },   // höchste Stufe des Tages = Abrechnungsgrundlage
    star: null,
    newsShow: [],                    // gewählte Meldungen (max 3)
    transmitters: 0, satellite:false,
    studio:false,
    image: 33.34, imgHist: [],
    love: 0,
    aiSkill: aiSkill||0,
    lastAud: new Array(BLOCKS).fill(0),
    todayAud: new Array(BLOCKS).fill(0),
    audHist: [],
    awards: 0,
    culturePoints: 0, newsPoints: 0, primePoints: 0,
    lowImageDays: 0
  };
}

function emptyDay(){
  const a = [];
  for(let i=0;i<BLOCKS;i++) a.push({ prog:null, ad:null, aired:false, res:null });
  return a;
}
function getDay(ch, day){
  if(!ch.sched[day]) ch.sched[day] = emptyDay();
  return ch.sched[day];
}

/* ─── Genre-Konjunktur ─── */
function initTrends(){
  const t = {};
  Object.keys(GENRES).forEach(g => { t[g] = 0.9 + rnd()*0.25; });
  return t;
}
function driftTrends(){
  Object.keys(G.trend).forEach(g => {
    let v = G.trend[g] + (rnd()-0.5)*0.13;
    // sanfte Rückkehr zur Mitte, damit kein Genre dauerhaft tot ist
    v += (1 - v)*0.09;
    G.trend[g] = clamp(v, 0.68, 1.34);
  });
}
function trendOf(genre){ return (G.trend && G.trend[genre]) || 1; }

/* ─── Neues Spiel ─── */
function newGame(playerName, diffKey, opts){
  const d = DIFFS[diffKey];
  UID = 1;
  G = {
    diff: diffKey, D: d,
    opt: Object.assign({ timePressure:true, sound:true }, opts||{}),
    trend: null,
    day: 1, weekday: 0, week: 1,
    time: DAY_START,
    speed: 2, paused: false,
    over: false, overMsg: null,
    floor: 6,                 // Startetage: eigenes Büro
    elevBusy: 0,              // verbleibende Spielminuten Fahrzeit
    elevTarget: null,
    room: null,               // aktuell betretener Raum (null = Hochhausansicht)
    catalog: buildCatalog(),
    market: [],               // Filmagentur-Angebot
    auction: null,
    adMarket: [],
    newsPool: { pol:[], spo:[], sho:[], sen:[], tec:[] },
    log: [],
    player: makeChannel(playerName || 'Mad TV', false, d.money, 0),
    ch: [],
    events: { terrorSign:'self', terrorDay:0, pendingTerror:false },
    production: null,         // laufende Eigenproduktion
    stats: { revenue:0, costs:0, filmsBought:0, contractsDone:0, contractsFailed:0 },
    gifts: []
  };
  // Die Konkurrenz startet nicht mit dem Kapital des Spielers, sondern mit
  // eigenem — sonst macht ein knapper Schwierigkeitsgrad auch die KI arm und
  // damit harmlos. Höhere Stufe heißt: du ärmer, sie reicher und cleverer.
  const aiMoney = s => Math.round(500000 + s*700000);
  G.ch = [ G.player,
           makeChannel(RIVAL_NAMES[0], true, aiMoney(d.aiSkill), d.aiSkill),
           makeChannel(RIVAL_NAMES[1], true, aiMoney(d.aiSkill*0.92), d.aiSkill*0.92) ];
  G.player.image = 33.34; G.ch[1].image = 33.33; G.ch[2].image = 33.33;

  G.trend = initTrends();
  refreshMarket(true);
  refreshAdMarket(true);
  rollNews();
  // Startausstattung: drei günstige Lizenzen, damit der erste Abend nicht leer ist
  G.market.slice(0,3).forEach(m => { buyLicence(G.player, m, true); });
  // Konkurrenz ebenfalls ausstatten und ihren ersten Sendetag planen
  for(let i=1;i<3;i++){
    for(let k=0;k<4;k++){
      const c = G.market.filter(m=>m.price < 140000);
      if(c.length) buyLicence(G.ch[i], pick(c), true);
    }
  }
  G.day = 0;
  for(let i=1;i<3;i++) aiTurn(G.ch[i]);   // plant für Tag 1
  G.day = 1;
  refreshMarket(false);
  return G;
}

/* ─── Filmmarkt auffrischen ─── */
function refreshMarket(initial){
  const owned = new Set();
  G.ch.forEach(c => c.licences.forEach(l => owned.add(l.title)));
  if(initial){ G.market = []; }
  // alte Angebote teilweise entfernen
  if(!initial){
    G.market = G.market.filter(()=> rnd() > 0.22);
  }
  const want = 30;
  let guard = 0;
  while(G.market.length < want && guard++ < 400){
    const c = pick(G.catalog);
    if(owned.has(c.title)) continue;
    if(G.market.some(m => m.title === c.title)) continue;
    const copy = Object.assign({}, c, { uid: uid() });
    G.market.push(copy);
  }
  G.market.sort((a,b)=> a.price - b.price);
}

/* ─── Werbemarkt auffrischen ─── */
function refreshAdMarket(initial){
  if(initial) G.adMarket = [];
  G.adMarket = G.adMarket.filter(c => c.deadline > G.day && rnd() > 0.18);
  const want = 14;
  while(G.adMarket.length < want){
    G.adMarket.push(makeContract(G.day));
  }
  G.adMarket.sort((a,b)=> a.minAud - b.minAud);
}

/* ─── Nachrichten des Tages ─── */
function rollNews(){
  RESSORTS.forEach(r => {
    const arr = G.newsPool[r.id];
    // alte Meldungen altern lassen / entfernen
    const kept = arr.filter(n => G.day - n.day < 3);
    const add = 3;
    for(let i=0;i<add;i++) kept.push(makeNews(r.id, G.day));
    G.newsPool[r.id] = kept;
  });
  // Auswahl des Spielers auf Gültigkeit prüfen
  G.ch.forEach(ch => {
    ch.newsShow = ch.newsShow.filter(n => G.day - n.day < 3);
  });
}

/* ─── Lizenz kaufen ─── */
function buyLicence(ch, mkt, free){
  if(!free && ch.money < mkt.price) return false;
  const idx = G.market.indexOf(mkt);
  if(idx >= 0) G.market.splice(idx,1);
  if(!free){ ch.money -= mkt.price; if(ch===G.player) G.stats.costs += mkt.price; }
  const lic = Object.assign({}, mkt, { uid: uid(), fresh:1, aired:0, lastDay:-99, ep:1 });
  ch.licences.push(lic);
  if(ch === G.player) G.stats.filmsBought++;
  return lic;
}

/* ─── Reichweite eines Senders (0…1) ─── */
function reachOf(ch){
  return clamp(0.40 + ch.transmitters*0.11 + (ch.satellite?0.22:0), 0, 1);
}

/* ═══════════════════════════════════════════════════════════════════
   TEIL 3 — QUOTEN-ENGINE
   ═══════════════════════════════════════════════════════════════════ */

const ATTR_OFF = 1.15;   // "Fernseher aus" konkurriert mit allen Sendern

/* Nachrichten-Attraktivität eines Senders je Zielgruppe */
function newsAttraction(ch){
  const out = new Array(GROUPS.length).fill(0);
  if(!ch.newsShow.length) return out;
  ch.newsShow.forEach(n => {
    const r = RESSORTS.find(x=>x.id===n.res);
    const age = clamp(1 - (G.day - n.day)*0.35, 0, 1);
    const lvl = ch.newsSub[n.res] || 0;
    const q   = NEWS_QUAL[lvl];
    for(let i=0;i<GROUPS.length;i++){
      out[i] += n.weight * age * q * r.aff[i];
    }
  });
  for(let i=0;i<GROUPS.length;i++) out[i] = out[i] / 3;
  return out;
}

/* Attraktivität eines Sendeblocks je Zielgruppe */
function blockAttraction(ch, day, block, newsAttr){
  const slots = getDay(ch, day);
  const s = slots[block];
  const out = new Array(GROUPS.length).fill(0.05);
  const hour = BLOCK_H[block];
  if(!s.prog){
    // Testbild: nur Nachrichten halten ein paar Zuschauer
    for(let i=0;i<GROUPS.length;i++) out[i] = 0.05 + newsAttr[i]*0.10;
    return out;
  }
  const p = s.prog;
  const gd = GENRES[p.genre];
  const qEff = p.qual * (0.34 + 0.66*p.fresh);
  // Trailer: lief das Programm heute schon in einem Werbeblock?
  let trailer = 0;
  for(let b=0;b<block;b++){
    if(slots[b].trailer && slots[b].trailer.uid === p.uid) trailer += 0.13;
  }
  // Zuschauerfluss: gleiches Genre im Block davor hält Zuschauer
  let flow = 0;
  if(block>0 && slots[block-1].prog){
    if(slots[block-1].prog.genre === p.genre) flow = 0.11;
    else if(GENRES[slots[block-1].prog.genre].kult === gd.kult) flow = 0.04;
  }
  // Serien: fester Sendeplatz bindet das Publikum, Springen vertreibt es
  let loyal = 0;
  if(p.isSerie && p.lastBlock !== undefined && p.lastBlock !== null){
    loyal = (p.lastBlock === block) ? 0.13 : -0.09;
  }
  // Starmoderator
  let star = 0;
  if(ch.star && ch.star.genres.indexOf(p.genre) >= 0) star = ch.star.boost;
  // Genre-Konjunktur
  const tr = trendOf(p.genre);
  for(let i=0;i<GROUPS.length;i++){
    let a = (qEff/52) * gd.aff[i] * tr;
    a *= (1 + newsAttr[i]*0.30);
    a *= (1 + trailer + flow + loyal + star);
    // Altersfreigabe
    if(p.fsk >= 18){
      if(hour >= 6 && hour < 22) a *= 0.42;
      if(GROUPS[i].id === 'kind') a *= 0.05;
    } else if(p.fsk >= 16){
      if(hour >= 6 && hour < 20) a *= 0.72;
      if(GROUPS[i].id === 'kind') a *= 0.18;
    } else if(p.fsk >= 12 && GROUPS[i].id === 'kind'){
      a *= 0.55;
    }
    out[i] = Math.max(0.02, a);
  }
  return out;
}

/* Einen Sendeblock aller Sender auswerten */
function airBlock(day, block){
  const news = G.ch.map(newsAttraction);
  const attrs = G.ch.map((c,i) => blockAttraction(c, day, block, news[i]));
  const reach = G.ch.map(reachOf);
  const result = G.ch.map(()=>({ total:0, groups:new Array(GROUPS.length).fill(0) }));

  for(let gi=0; gi<GROUPS.length; gi++){
    const grp = GROUPS[gi];
    const potential = POP * grp.share * grp.act[block];
    let denom = ATTR_OFF;
    for(let c=0;c<3;c++) denom += attrs[c][gi] * reach[c];
    for(let c=0;c<3;c++){
      const v = potential * (attrs[c][gi]*reach[c]) / denom;
      result[c].groups[gi] = v;
      result[c].total += v;
    }
  }

  // Ergebnisse eintragen, Abnutzung, Werbung abrechnen
  G.ch.forEach((ch, ci) => {
    const slots = getDay(ch, day);
    const s = slots[block];
    s.aired = true;
    s.res = result[ci];
    ch.todayAud[block] = result[ci].total;
    if(s.prog){
      const p = s.prog;
      p.aired++; p.lastDay = day; p.lastBlock = block;
      if(p.isSerie){
        p.fresh = Math.max(0.15, p.fresh*0.86);
        p.ep++;
        if(p.ep > p.eps){ p.ep = 1; p.fresh = Math.max(0.1, p.fresh*0.55); }
      } else {
        p.fresh = Math.max(0.08, p.fresh*0.48);
      }
      // Kultur-/Nachrichtenpunkte für Sammy & Betty
      if(GENRES[p.genre].kult){
        const starK = (ch.star && ch.star.id === 'harms') ? 2 : 1;
        ch.culturePoints += p.critic/100 * (result[ci].total/1000000) * starK;
        if(!ch.isAI) G.player._cultureToday = (G.player._cultureToday||0) +
          ((p.critic/100)*(1+result[ci].total/6000000) + (p.bettyBonus||0)*0.16) * starK;
      }
      if(block===2 || block===3) ch.primePoints += result[ci].total/1000000;
      // Gerichtsvollzieher-Risiko
      if(p.fsk >= 18 && BLOCK_H[block] < 22 && BLOCK_H[block] >= 6 && !ch.isAI){
        if(rnd() < 0.25) G._bailiff = true;
      }
    }
    ch.newsPoints += ch.newsShow.reduce((a,n)=>{
      const age = clamp(1-(G.day-n.day)*0.35,0,1);
      return a + n.weight*age*NEWS_QUAL[ch.newsSub[n.res]||0];
    },0) * (result[ci].total/4000000);

    // Werbespot abrechnen
    if(s.ad){
      const ct = ch.contracts.find(c=>c.id === s.ad.id);
      if(ct && ct.done < ct.spots){
        const reached = ct.group ? result[ci].groups[ct.gi] : result[ci].total;
        if(reached >= ct.minAud){
          ct.done++;
          ch.money += ct.perSpot;
          if(!ch.isAI){
            G.stats.revenue += ct.perSpot;
            toast('good','Werbespot gelaufen', ct.brand + ' zahlt ' + money(ct.perSpot));
            sfx('cash');
          }
        } else if(!ch.isAI){
          toast('warn','Quote verfehlt', ct.brand + ': ' + viewers(reached) + ' statt ' + viewers(ct.minAud));
          sfx('miss');
        }
      }
    }
  });

  // Ereignisprotokoll für den Spieler
  const pr = result[0];
  const shareBase = result.reduce((a,r)=>a+r.total,0) || 1;
  G.log.unshift({
    day, block, aud: pr.total, share: pr.total/shareBase,
    title: getDay(G.player,day)[block].prog ? getDay(G.player,day)[block].prog.title : 'Testbild'
  });
  if(G.log.length > 90) G.log.length = 90;
}

/* ═══════════════════════════════════════════════════════════════════
   TEIL 4 — TAGESABSCHLUSS
   ═══════════════════════════════════════════════════════════════════ */

function endOfDay(){
  const day = G.day;
  const totals = G.ch.map(c => c.todayAud.reduce((a,b)=>a+b,0));
  const sum = totals.reduce((a,b)=>a+b,0) || 1;

  // ── Image (Marktanteil, gleitend) ──
  G.ch.forEach((c,i) => {
    const share = totals[i]/sum*100;
    c.image = c.image*0.72 + share*0.28;
    c.audHist.push(totals[i]);
    if(c.audHist.length>21) c.audHist.shift();
    c.lastAud = c.todayAud.slice();
    c.todayAud = new Array(BLOCKS).fill(0);
  });
  const isum = G.ch.reduce((a,c)=>a+c.image,0);
  G.ch.forEach(c => c.image = c.image/isum*100);

  // ── Laufende Kosten ──
  // Nachrichten werden nach der höchsten am Tag eingestellten Abostufe abgerechnet,
  // damit sich ein Abo nicht nach Sendeschluss kostenlos abbestellen lässt.
  G.ch.forEach(c => {
    let cost = 0;
    RESSORTS.forEach(r => cost += NEWS_COST[Math.max(c.newsSub[r.id]||0, c.newsSubMax[r.id]||0)]);
    cost += c.transmitters * 18000;
    if(c.satellite) cost += 55000;
    if(c.studio) cost += 40000;
    if(c.star) cost += c.star.salary;
    cost += Math.round(c.credit * 0.006);          // Tageszins
    c.money -= cost;
    if(!c.isAI){ G.stats.costs += cost; G._dailyCost = cost; }
    RESSORTS.forEach(r => c.newsSubMax[r.id] = c.newsSub[r.id]||0);
  });

  // ── Werbeverträge: Fristen ──
  G.ch.forEach(c => {
    c.contracts = c.contracts.filter(ct => {
      if(ct.done >= ct.spots){
        if(!c.isAI){ G.stats.contractsDone++; toast('good','Vertrag erfüllt', ct.brand + ' — alle ' + ct.spots + ' Spots gelaufen.'); }
        return false;
      }
      if(day >= ct.deadline){
        c.money -= ct.penalty;
        if(!c.isAI){
          G.stats.contractsFailed++; G.stats.costs += ct.penalty;
          toast('bad','Konventionalstrafe', ct.brand + ' verlangt ' + money(ct.penalty));
          sfx('bad');
        }
        return false;
      }
      return true;
    });
  });

  // ── Abnutzung erholt sich ──
  G.ch.forEach(c => c.licences.forEach(l => {
    if(l.lastDay < day) l.fresh = Math.min(1, l.fresh + 0.10);
  }));

  // ── Betty ──
  updateBetty();

  // ── Eigenproduktion ──
  if(G.production){
    G.production.left--;
    if(G.production.left <= 0){
      const pr = G.production.def;
      const lic = {
        uid: uid(), title: pr.name + ' #' + G.production.no, genre: pr.genre,
        year: 1991, tier: 3, fsk: 6, price: pr.cost,
        qual: clamp(Math.round(pr.quality + ri(-6,8)),10,98),
        critic: clamp(Math.round(pr.quality + (GENRES[pr.genre].krit*30) + ri(-5,10)),5,99),
        box: 40, fresh:1, aired:0, lastDay:-99,
        isSerie: !!pr.episodes, eps: pr.episodes||0, ep:1, produced:true,
        bettyBonus: pr.betty
      };
      G.player.licences.push(lic);
      toast('good','Produktion fertig', lic.title + ' liegt im Archiv bereit.');
      G.production = null;
    }
  }

  // ── Gerichtsvollzieher ──
  if(G._bailiff){
    G._bailiff = false;
    const cand = G.player.licences.filter(l=>!l.produced);
    if(cand.length){
      const l = pick(cand);
      G.player.licences.splice(G.player.licences.indexOf(l),1);
      removeFromSchedules(G.player, l);
      modal('⚖️','Der Gerichtsvollzieher','Gerichtsvollzieher',
        'Sie haben einen Film ab 18 Jahren vor 22 Uhr gesendet. Die Lizenz «'+esc(l.title)+'» wird hiermit beschlagnahmt. Einen schönen Tag noch.',
        [{t:'Verdammt.',cls:'btn'}]);
    }
  }

  // ── Sammy Awards (wöchentlich) ──
  if(day % 7 === 0) sammyAwards();

  // ── KI-Runde ──
  for(let i=1;i<3;i++) aiTurn(G.ch[i]);

  // ── Chef ──
  bossCheck();

  // ── Zufallsereignis ──
  randomEvent();

  // ── Sieg / Niederlage ──
  checkEnd();
  if(G.over) return;

  // ── Alte Sendepläne aufräumen ──
  G.ch.forEach(c => Object.keys(c.sched).forEach(d => { if(+d < G.day-1) delete c.sched[d]; }));

  // ── Neuer Tag ──
  G.day++;
  G.weekday = (G.weekday+1)%7;
  if(G.weekday===0) G.week++;
  G.time = DAY_START;
  G.player._cultureToday = 0;
  driftTrends();
  refreshMarket(false);
  refreshAdMarket(false);
  rollNews();
  closeAuction();          // Tagesende: der Höchstbietende bekommt den Zuschlag
  maybeAuction();
  autosave();
}

function removeFromSchedules(ch, lic){
  Object.keys(ch.sched).forEach(d => {
    ch.sched[d].forEach(s => {
      if(s.prog && s.prog.uid === lic.uid && !s.aired) s.prog = null;
      if(s.trailer && s.trailer.uid === lic.uid && !s.aired) s.trailer = null;
    });
  });
}

/* ─── Betty ─── */
function updateBetty(){
  G.ch.forEach(c => {
    let gain = 0;
    if(!c.isAI){
      gain += (G.player._cultureToday||0) * 1.35;
    } else {
      // KI umwirbt Betty über Kultur & Geschenke
      gain += c.culturePoints*0.012 + c.aiSkill*0.45 + (c.money > 900000 ? c.aiSkill*0.5 : 0);
      if(c.money > 400000 && rnd() < c.aiSkill*0.35){
        const g = GIFTS.filter(x=>x.cost < c.money*0.35 && c.love >= x.min);
        if(g.length){ const x = g[g.length-1]; c.money -= x.cost; gain += x.love*0.55; }
      }
    }
    c.love = clamp(c.love + gain, 0, 100);
    // Zuneigung kann das eigene Image niemals überflügeln (Originalregel)
    if(c.love > c.image) c.love = c.image;
    c.love = Math.max(0, c.love - 0.35);   // täglicher Schwund
  });
  G.player._cultureToday = 0;
}

/* ─── Sammy Awards ─── */
function sammyAwards(){
  const cats = [
    { k:'newsPoints',    n:'Beste Nachrichtensendung', prize:120000, img:1.2 },
    { k:'culturePoints', n:'Beste Kultursendung',      prize:90000,  img:1.6 },
    { k:'primePoints',   n:'Beste Primetime-Quote',    prize:200000, img:1.0 }
  ];
  const lines = [];
  cats.forEach(cat => {
    let best = 0, bi = 0;
    G.ch.forEach((c,i)=>{ if(c[cat.k] > best){ best = c[cat.k]; bi = i; } });
    const w = G.ch[bi];
    w.money += cat.prize; w.awards++; w.image += cat.img;
    lines.push('<b>'+cat.n+'</b> → '+esc(w.name)+(bi===0?' 🏆':''));
  });
  const isum = G.ch.reduce((a,c)=>a+c.image,0);
  G.ch.forEach(c => { c.image = c.image/isum*100; c.newsPoints=0; c.culturePoints=0; c.primePoints=0; });
  sfx('award');
  modal('🏆','Die Sammy-Verleihung','Sammy Awards',

/* ─── Zufallsereignisse ─── */
function randomEvent(){
  const p = G.player;
  const r = rnd();
  if(r < 0.10 && G.day > 3){
    // Terrorwarnung
    G.events.pendingTerror = true;
    G.events.terrorDay = G.day + 1;
    modal('💣','Bombendrohung','Nachrichtenagentur',
      'Eine anonyme Drohung ist eingegangen: Morgen soll im Sendehochhaus ein Sprengsatz hochgehen. '+
      'Im Foyer hängt das Türschild-Verzeichnis — wer es umhängt, schickt die Herrschaften in eine andere Etage.',
      [{t:'Verstanden',cls:'btn'}]);
  } else if(r < 0.16 && G.day > 2){
    // Film gestohlen / überboten
    const rival = pick([G.ch[1],G.ch[2]]);
    if(G.market.length){
      const m = G.market[G.market.length-1];
      if(rival.money > m.price){
        G.market.splice(G.market.indexOf(m),1);
        rival.money -= m.price;
        rival.licences.push(Object.assign({},m,{uid:uid()}));
        toast('warn','Weggeschnappt', esc(rival.name)+' hat «'+m.title+'» gekauft.');
      }
    }
  } else if(r < 0.21 && G.day > 4){
    const bonus = ri(40000,140000);
    p.money += bonus;
    toast('good','Sponsorenscheck','Ein Getränkekonzern überweist '+money(bonus)+' fürs Product Placement.');
  } else if(r < 0.26 && G.day > 5){
    const loss = ri(30000,110000);
    p.money -= loss;
    toast('bad','Technischer Defekt','Die Sendeleitung ist durchgeschmort: '+money(loss)+' Reparatur.');
  }

  // Anschlag ausführen
  if(G.events.pendingTerror && G.day >= G.events.terrorDay){
    G.events.pendingTerror = false;
    if(G.events.terrorSign === 'self'){
      const cand = p.licences.filter(l=>!l.produced);
      let txt = 'Das halbe Stockwerk liegt in Trümmern.';
      if(cand.length){
        const lost = [];
        for(let i=0;i<Math.min(2,cand.length);i++){
          const l = pick(cand.filter(x=>!lost.includes(x)));
          if(l){ lost.push(l); p.licences.splice(p.licences.indexOf(l),1); removeFromSchedules(p,l); }
        }
        txt += ' Verbrannt sind: ' + lost.map(l=>'«'+esc(l.title)+'»').join(', ') + '.';
      }
      p.money -= 80000;
      modal('💥','Es hat gekracht','Schadensmeldung', txt + ' Aufräumkosten: '+money(80000)+'.',
        [{t:'Na großartig.',cls:'btn'}]);
    } else {
      const victim = G.events.terrorSign === 'rival1' ? G.ch[1] : G.ch[2];
      const cand = victim.licences;
      if(cand.length){
        for(let i=0;i<2 && cand.length;i++){
          const l = pick(cand);
          victim.licences.splice(victim.licences.indexOf(l),1);
          removeFromSchedules(victim,l);
        }
      }
      victim.money -= 80000;
      modal('💥','Es hat gekracht','Schadensmeldung',
        'Der Sprengsatz ging in der Etage von '+esc(victim.name)+' hoch. Deren Archiv ist ein Aschehaufen. '+
        'Wie bedauerlich.', [{t:'Wie bedauerlich.',cls:'btn'}]);
      G.events.terrorSign = 'self';
    }
  }
}

/* ─── Auktion ─── */
function maybeAuction(){

  G._auctionWarned = false;
  if(G.day > 2 && rnd() < 0.38){
    const c = pick(G.catalog.filter(x=>x.tier>=4));
    G.auction = Object.assign({}, c, {
      uid: uid(), fresh:1, aired:0, lastDay:-99, ep:1,
      bid: Math.round(c.price*0.45/1000)*1000,
      leader: null, rounds: 0, closed:false
    });
  }

/* Konkurrenz steigert auch ohne den Spieler mit — einmal pro Sendeblock */
function auctionTick(){
  const a = G.auction;
  if(!a || a.closed) return;
  for(let i=1;i<3;i++){
    const c = G.ch[i];
    const limit = a.price * (0.8 + c.aiSkill*0.75);
    const next = Math.round(a.bid*1.12/1000)*1000;
    if(a.leader === c.name) continue;
    if(c.money > next*1.4 && next < limit && rnd() < c.aiSkill*0.45){
      a.bid = next; a.leader = c.name; a.rounds++;
      if(!G._auctionWarned){
        G._auctionWarned = true;
        toast('warn','Auktion läuft', esc(c.name)+' bietet auf «'+a.title+'».');
      }
      break;
    }
  }
  if(a.rounds >= 8) closeAuction();
}

function closeAuction(){
  const a = G.auction;
  if(!a || a.closed) return;
  a.closed = true;
  if(!a.leader) return;
  const w = G.ch.find(c => c.name === a.leader);
  if(!w) return;
  w.money -= a.bid;
  const lic = Object.assign({}, a, { uid:uid(), fresh:1, aired:0, lastDay:-99, ep:1 });
  delete lic.bid; delete lic.leader; delete lic.rounds; delete lic.closed;
  w.licences.push(lic);
  if(w === G.player){
    G.stats.costs += a.bid;
    modal('🔨','Zuschlag!','Auktion','«'+esc(a.title)+'» gehört für '+money(a.bid)+' dir.',[{t:'Sehr gut',cls:'btn'}]);
  } else {
    toast('bad','Auktion verloren', esc(a.leader)+' erhält «'+a.title+'» für '+moneyShort(a.bid)+'.');
  }
}

/* ═══════════════════════════════════════════════════════════════════
   TEIL 5 — KÜNSTLICHE INTELLIGENZ DER KONKURRENZ
   ═══════════════════════════════════════════════════════════════════ */

function estimateAudience(ch, block){
  // grobe Selbsteinschätzung eines Senders für einen Sendeblock
  let pot = 0;
  for(let i=0;i<GROUPS.length;i++) pot += POP*GROUPS[i].share*GROUPS[i].act[block];
  return pot * (ch.image/100) * (reachOf(ch)/0.55) * 0.62;
}

function progScore(ch, lic, block){
  const gd = GENRES[lic.genre];
  let s = 0;
  for(let i=0;i<GROUPS.length;i++){
    s += GROUPS[i].share * GROUPS[i].act[block] * gd.aff[i];
  }
  s *= lic.qual * (0.34+0.66*lic.fresh) * trendOf(lic.genre);
  if(ch.star && ch.star.genres.indexOf(lic.genre) >= 0) s *= (1 + ch.star.boost);
  if(lic.isSerie && lic.lastBlock === block) s *= 1.13;
  const hour = BLOCK_H[block];
  if(lic.fsk>=18 && hour>=6 && hour<22) s *= 0.35;
  if(lic.fsk>=16 && hour>=6 && hour<20) s *= 0.7;
  return s;
}

/* Programmplätze eines Tages füllen (ohne Werbung) */
function aiPlanDay(ch, day){
  const slots = getDay(ch, day);
  const used = new Set();
  slots.forEach(s => { if(s.aired && s.prog) used.add(s.prog.uid); });
  for(let b=0;b<BLOCKS;b++){
    if(slots[b].aired) continue;
    const avail = ch.licences.filter(l => !used.has(l.uid));
    if(!avail.length){ slots[b].prog = null; continue; }
    avail.sort((a,bb)=> progScore(ch,bb,b) - progScore(ch,a,b));
    const idx = rnd() < ch.aiSkill ? 0 : Math.min(avail.length-1, ri(0,2));
    slots[b].prog = avail[idx];
    used.add(avail[idx].uid);
  }
}

function aiTurn(ch){
  const sk = ch.aiSkill;
  const nextDay = G.day+1;

  // Nachrichtenabos
  RESSORTS.forEach(r => {
    const want = ch.money > 700000 ? (sk>0.85?3:2) : (ch.money>300000?1:0);
    ch.newsSub[r.id] = (rnd() < sk*0.75) ? want : Math.max(0, want-1);
  });
  // Nachrichtensendung
  const cand = [];
  RESSORTS.forEach(r => {
    if((ch.newsSub[r.id]||0) > 0) G.newsPool[r.id].forEach(n => cand.push(n));
  });
  cand.sort((a,b)=> (b.weight - (G.day-b.day)*0.3) - (a.weight - (G.day-a.day)*0.3));
  ch.newsShow = cand.slice(0,3);

  // Lizenzen kaufen
  let budget = ch.money * (0.30 + sk*0.28);
  let tries = 0;
  while(budget > 30000 && ch.licences.length < 16 && tries++ < 30){
    const affordable = G.market.filter(m => m.price <= budget && m.price <= ch.money*0.5);
    if(!affordable.length) break;
    affordable.sort((a,b)=> (b.qual/Math.max(1,b.price))*(rnd()*0.4+0.8) - (a.qual/Math.max(1,a.price)));
    const buy = affordable[Math.floor(rnd()*Math.min(4,affordable.length))];
    if(!buy) break;
    budget -= buy.price;
    buyLicence(ch, buy, false);
  }

  // Sendemasten
  if(ch.money > 900000 && ch.transmitters < 4 && rnd() < sk*0.4){
    ch.money -= 380000; ch.transmitters++;
  } else if(ch.money > 1600000 && !ch.satellite && rnd() < sk*0.35){
    ch.money -= 900000; ch.satellite = true;
  }
  // Starmoderator verpflichten
  if(!ch.star && ch.money > 4000000 && rnd() < sk*0.5){
    const s = pick(STARS);
    ch.money -= s.fee; ch.star = s;
  }

  // Sendeplan für die nächsten Tage — auch damit die Prognose des Spielers
  // für kommende Tage gegen ein echtes Konkurrenzprogramm rechnet.
  for(let d=nextDay; d<=nextDay+2; d++) aiPlanDay(ch, d);
  const slots = getDay(ch, nextDay);

  // Werbeverträge annehmen
  const estMax = estimateAudience(ch, 3);
  while(ch.contracts.length < 4){
    const fit = G.adMarket.filter(c => c.minAud <= estMax*(0.55+sk*0.6) && !c.owner);
    if(!fit.length) break;
    fit.sort((a,b)=> b.perSpot*b.spots - a.perSpot*a.spots);
    const take = fit[0];
    take.owner = ch.name;
    G.adMarket.splice(G.adMarket.indexOf(take),1);
    ch.contracts.push(Object.assign({}, take, { deadline: G.day + take.days, done:0 }));
  }
  // Spots verteilen
  ch.contracts.forEach(ct => {
    let need = ct.spots - ct.done;
    for(let b=BLOCKS-1;b>=0 && need>0;b--){
      if(!slots[b].ad && estimateAudience(ch,b) >= ct.minAud*(ct.group?0.25:1)){
        slots[b].ad = { id: ct.id, brand: ct.brand };
        need--;
      }
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════
   TEIL 6 — ZEITSCHLEIFE & NAVIGATION
   ═══════════════════════════════════════════════════════════════════ */

let tickTimer = null;
let dirty = true;
let tickCount = 0;

function startLoop(){
  if(tickTimer) clearInterval(tickTimer);
  scheduleTick();
}
function scheduleTick(){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, SPEEDS[G.speed]);
}
function setSpeed(s){
  G.speed = s; G.paused = false; scheduleTick(); dirty = true; renderAll();
}
function togglePause(){
  G.paused = !G.paused; dirty = true; renderAll();
}

function tick(){
  // Erzähldialoge halten die Uhr an, Auswahldialoge nicht — sonst ließe sich
  // der ganze Sendetag im geöffneten Menü in Ruhe durchplanen.
  if(!G || G.over || G.paused || (modalOpen && modalPauses)) { renderTop(); return; }
  G.time++;
  tickCount++;

  // Aufzug
  if(G.elevBusy > 0){
    G.elevBusy--;
    if(G.elevBusy === 0 && G.elevTarget !== null){
      G.floor = G.elevTarget;
      G.room = FLOORS[G.floor].id;
      G.elevTarget = null;
      dirty = true;
    }
  }

  // Sendeblöcke
  for(let b=0;b<BLOCKS;b++){
    const t = (BLOCK_H[b] < 6 ? BLOCK_H[b]+24 : BLOCK_H[b]) * 60;
    if(G.time === t){
      airBlock(G.day, b);
      auctionTick();
      if(b===0) sfx('onair');
      dirty = true;
    }
  }

  if(G.time >= DAY_END){
    endOfDay();
    dirty = true;
    if(G.over){ renderAll(); showEnd(); return; }
  }

  renderTop();
  if(dirty || tickCount % 12 === 0){ renderView(); dirty = false; }
}

/* ─── Fahrstuhl ─── */
function goFloor(f){
  if(G.over) return;
  if(G.elevBusy > 0) return;
  if(f === G.floor){ G.room = FLOORS[f].id; dirty = true; renderView(); return; }
  const dist = Math.abs(f - G.floor);
  // Fahrzeit in Spielminuten. Bei aktivem Zeitdruck kostet jede Fahrt spürbar
  // Sendetag — ohne ihn bleibt es beim symbolischen Aufenthalt im Fahrstuhl.
  G.elevBusy = G.opt.timePressure ? (dist*3 + 3) : (dist + 2);
  G.elevTotal = G.elevBusy;
  G.elevTarget = f;
  G.room = null;
  dirty = true; renderView();
}
function leaveRoom(){ G.room = null; dirty = true; renderView(); }

/* ─── Ton (vollständig synthetisiert, keine externen Dateien) ─── */
let audioCtx = null;
const SFX = {
  onair: { f:[220,330,440], t:0.10, type:'triangle', gain:0.16 },
  cash:  { f:[880,1320],    t:0.07, type:'square',   gain:0.09 },
  miss:  { f:[300,190],     t:0.11, type:'sawtooth', gain:0.09 },
  buy:   { f:[520,780],     t:0.06, type:'triangle', gain:0.10 },
  bad:   { f:[240,150,110], t:0.13, type:'sawtooth', gain:0.12 },
  award: { f:[523,659,784,1047], t:0.11, type:'triangle', gain:0.14 },
  love:  { f:[659,880,1047],t:0.12, type:'sine',     gain:0.14 }
};
function sfx(kind){
  if(!G || !G.opt || !G.opt.sound) return;
  const s = SFX[kind]; if(!s) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    s.f.forEach((freq,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i*s.t;
      o.type = s.type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(s.gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + s.t);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + s.t + 0.02);
    });
  }catch(e){ /* Ton ist Beiwerk — niemals das Spiel daran scheitern lassen */ }
}

let modalOpen = false;
let modalPauses = true;
let modalStack = [];

function modal(ico, title, who, html, buttons){
  modalStack.push({ico,title,who,html,buttons,pause:true});
  if(!modalOpen) showNextModal();
}
function showNextModal(){
  if(!modalStack.length){ modalOpen = false; modalPauses = true; el('modal').classList.remove('on'); dirty=true; renderView(); return; }
  const m = modalStack.shift();
  modalOpen = true;
  modalPauses = m.pause !== false;
  const btns = (m.buttons && m.buttons.length ? m.buttons : [{t:'OK',cls:'btn'}]);
  el('mbox').innerHTML =
    '<div class="mh"><div class="ico">'+m.ico+'</div><div><div class="who">'+esc(m.who||'')+'</div>'+
    '<h3>'+esc(m.title)+'</h3></div></div><p>'+m.html+'</p>'+
    '<div class="mf">'+btns.map((b,i)=>'<button class="'+(b.cls||'btn')+'" data-i="'+i+'">'+esc(b.t)+'</button>').join('')+'</div>';
  el('mbox').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const f = btns[+b.dataset.i].fn;
      el('modal').classList.remove('on'); modalOpen = false;
      if(f) f();
      // Öffnet die Aktion selbst einen Dialog (Untermenü), darf der Stapel
      // nicht zusätzlich weitergeschaltet werden — sonst schließt er sofort wieder.
      setTimeout(()=>{ if(!modalOpen) showNextModal(); }, 30);
    };
  });
  el('modal').classList.add('on');
  if(m.onShow) m.onShow(el('mbox'));
}
function closeModal(){
  el('modal').classList.remove('on'); modalOpen=false; modalPauses=true;
  setTimeout(()=>{ if(!modalOpen) showNextModal(); },20);
}

function toast(type, title, desc){
  const d = document.createElement('div');
  d.className = 'toast ' + (type||'');
  d.innerHTML = '<div class="tt">'+esc(title)+'</div><div class="td">'+esc(desc||'')+'</div>';
  el('toasts').appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0'; setTimeout(()=>d.remove(),320); }, 4200);
  while(el('toasts').children.length > 5) el('toasts').firstChild.remove();
}

/* generischer Auswahldialog */
function chooser(title, who, ico, items, onPick, emptyTxt){
  if(!items.length){
    modal(ico, title, who, '<span class="dim">'+esc(emptyTxt||'Hier ist nichts verfügbar.')+'</span>', [{t:'Schließen',cls:'btn ghost'}]);
    return;
  }
  const html = '<div class="list">' + items.map((it,i)=>
    '<div class="item pickitem" data-i="'+i+'" style="cursor:pointer" role="button" tabindex="0">'+
      '<div style="min-width:0;flex:1"><div class="t">'+it.label+'</div><div class="m">'+it.sub+'</div></div>'+
      (it.right?'<div class="r">'+it.right+'</div>':'')+
    '</div>').join('') + '</div>';
  modalStack.push({ico,title,who,html,buttons:[{t:'Abbrechen',cls:'btn ghost'}],
    pause: !G.opt.timePressure,
    onShow:(box)=>{
      box.querySelectorAll('.pickitem').forEach(n=>{
        const go = ()=>{
          const val = items[+n.dataset.i].value;
          el('modal').classList.remove('on'); modalOpen = false; modalPauses = true;
          onPick(val); dirty=true; renderView();
          setTimeout(()=>{ if(!modalOpen) showNextModal(); }, 30);
        };
        n.onclick = go;
        n.onkeydown = (ev)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); go(); } };
      });
    }});
  if(!modalOpen) showNextModal();
}

function fskTag(f){
  if(f>=18) return '<span class="tag b">FSK 18</span>';
  if(f>=16) return '<span class="tag w">FSK 16</span>';

}
function licMeta(l){
  const g = GENRES[l.genre];
  return g.ico+' '+g.name+' · '+l.year+(l.isSerie?' · Serie ('+l.eps+' Folgen, aktuell '+l.ep+')':'');

/* Während ein Auswahldialog offen ist, läuft die Uhr weiter — der Block kann
   also längst gesendet sein, wenn die Wahl zurückkommt. */
function slotEditable(day, b){
  if(day < G.day){ toast('warn','Zu spät','Der Tag ist vorbei.'); return false; }
  const s = getDay(G.player, day)[b];
  if(s.aired){ toast('warn','Zu spät', String(BLOCK_H[b]).padStart(2,'0')+':00 Uhr läuft bereits.'); return false; }
  return true;
}

/* Prognose: geschätzte Zuschauer für einen Block mit Kandidat */
function estimateBlock(day, block, cand){
  const slots = getDay(G.player, day);
  const old = slots[block].prog;
  slots[block].prog = cand || old;
  const news = G.ch.map(newsAttraction);
  const attrs = G.ch.map((c,i)=> blockAttraction(c, day, block, news[i]));
  const reach = G.ch.map(reachOf);
  slots[block].prog = old;
  let tot = 0, grp = new Array(GROUPS.length).fill(0);
  for(let gi=0;gi<GROUPS.length;gi++){
    const potential = POP*GROUPS[gi].share*GROUPS[gi].act[block];
    let den = ATTR_OFF;
    for(let c=0;c<3;c++) den += attrs[c][gi]*reach[c];
    const v = potential*(attrs[0][gi]*reach[0])/den;
    grp[gi] = v; tot += v;
  }
  return { total: tot, groups: grp };
}

      txt = esc(s.prog.title);
      sub = licMeta(s.prog) + ' · Frische '+Math.round(s.prog.fresh*100)+'%';

      if(s.prog.fsk>=18 && BLOCK_H[b]<22 && BLOCK_H[b]>=6) pc += ' bad';

      const ct = p.contracts.find(c=>c.id===s.ad.id);
      ac += ' filled';
      atxt = '📣 '+esc(s.ad.brand);

    } else if(s.trailer){
      ac += ' filled';
      atxt = '🎞️ Trailer'; asub = esc(s.trailer.title.slice(0,18));

      : 'data-act="pickprog" data-b="'+b+'" data-day="'+day+'" role="button" tabindex="0"';
    const adAttr = airedNow ? '' : 'data-act="pickad" data-b="'+b+'" data-day="'+day+'" role="button" tabindex="0"';

      '<div class="hr'+(prime?' prime':'')+'">'+String(BLOCK_H[b]).padStart(2,'0')+'</div>'+
      '<div class="'+pc+'" '+progAttr+'>'+
        '<div class="st">'+txt+'</div>'+(sub?'<div class="ss">'+sub+'</div>':'')+'</div>'+
      '<div class="'+ac+'" '+adAttr+'>'+
        '<div class="st">'+atxt+'</div>'+(asub?'<div class="ss">'+asub+'</div>':'')+'</div>'+
    '</div>';
  }
  h += '</div>';
  h += '<div class="hint">Ein Programm auf einem Werbeplatz wird zum <b>Trailer</b> und zieht später Zuschauer. '+
       'Filme ab 18 vor 22 Uhr kosten Quote — und rufen den Gerichtsvollzieher.</div>';
  h += '</div>';

  h += '<div class="card"><h3>Werbekoffer ('+p.contracts.length+'/4)</h3>';

    h += '<div class="empty-note">Kein Vertrag. Ohne Werbung kein Geld — ab in die Werbeagentur.</div>';

    h += '<table class="tbl"><tr><th>Kunde</th><th>Ziel</th><th class="right">Spots</th><th class="right">Frist</th><th class="right">pro Spot</th><th class="right">Strafe</th></tr>';

      const left = c.deadline - G.day;
      h += '<tr><td><b>'+esc(c.brand)+'</b><br><span class="dim" style="font-size:10.5px">'+esc(c.product)+'</span></td>'+

          (left<=0?'heute!':left+' T')+'</td>'+
        '<td class="right num ok">'+moneyShort(c.perSpot)+'</td>'+
        '<td class="right num bad">'+moneyShort(c.penalty)+'</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  // Zielgruppen: wer hat heute (bzw. gestern) tatsächlich zugesehen?
  const gsum = new Array(GROUPS.length).fill(0);
  let gday = null, gtotal = 0;
  [G.day, G.day-1].forEach(d=>{
    if(gday !== null) return;
    const sl = p.sched[d];
    if(sl && sl.some(s=>s.aired && s.res)){
      sl.forEach(s=>{ if(s.aired && s.res) s.res.groups.forEach((v,i)=>{ gsum[i]+=v; gtotal+=v; }); });
      gday = d;
    }
  });
  if(gtotal > 0){
    const gmax = Math.max(...gsum);
    h += '<div class="card"><h3>Wer hat zugesehen · '+(gday===G.day?'heute':'gestern')+'</h3>';

        '<div class="gv">'+viewers(gsum[i])+'</div>'+
        '<div class="gv dim">'+pct(gsum[i]/gtotal,0)+'</div></div>';

    h += '<div class="hint">Werbeverträge mit Zielgruppe zahlen nur, wenn genau diese Gruppe im Block erreicht wird. '+
         'Die Verteilung hängt am Genre und an der Uhrzeit.</div></div>';
  }

  // Genre-Konjunktur
  const trends = Object.keys(GENRES).map(g=>({g, v:trendOf(g)})).sort((a,b)=>b.v-a.v);
  h += '<div class="card"><h3>Genre-Konjunktur</h3><div class="btnrow">'+

    'Drittel mehr Zuschauer — günstig einkaufen, wenn es unten ist.</div></div>';

  // Quotenverlauf
  h += '<div class="card"><h3>Quotenverlauf gestern</h3><div class="chart">';
  const maxA = Math.max(1, ...G.ch.map(c=>Math.max(...c.lastAud)));

      h += '<i style="height:'+Math.max(1,v)+'px;background:'+col+'"></i>';
    });
    h += '<div class="lab">'+String(BLOCK_H[b]).padStart(2,'0')+'</div></div>';
  }
  h += '</div><div class="legend">'+G.ch.map((c,i)=>'<span><i style="background:'+
       ['var(--acc)','var(--warn)','var(--bad)'][i]+'"></i>'+esc(c.name)+'</span>').join('')+'</div></div>';

  // Sendeprotokoll
  if(G.log.length){
    h += '<div class="card"><h3>Sendeprotokoll</h3><table class="tbl">'+
      '<tr><th>Tag</th><th>Zeit</th><th>Sendung</th><th class="right">Zuschauer</th><th class="right">Anteil</th></tr>'+
      G.log.slice(0,14).map(e=>'<tr><td class="num dim">'+e.day+'</td>'+

      '</table></div>';
  }

  h += '</div>';
  return h;
};

function dailyCosts(){
  const c = G.player;
  let cost = 0;
  RESSORTS.forEach(r => cost += NEWS_COST[Math.max(c.newsSub[r.id]||0, c.newsSubMax[r.id]||0)]);
  cost += c.transmitters*18000 + (c.satellite?55000:0) + (c.studio?40000:0);
  cost += (c.star ? c.star.salary : 0);
  cost += Math.round(c.credit*0.006);
  return cost;
}

/* ─────────── NACHRICHTENSTUDIO ─────────── */
ROOMS.news = function(){
  const p = G.player;
  let h = '<div class="room">' + head('📰','Nachrichtenstudio','Abos wählen, Meldungen zur Sendung zusammenstellen');

  h += '<div class="card"><h3>Ressort-Abonnements</h3><table class="tbl">'+
       '<tr><th>Ressort</th><th>Stufe</th><th class="right">Kosten/Tag</th><th class="right">Aktualität</th></tr>';
  RESSORTS.forEach(r=>{
    const lvl = p.newsSub[r.id]||0;
    h += '<tr><td>'+r.ico+' '+esc(r.name)+'</td><td>'+
      [0,1,2,3].map(l=>'<button class="btn sm '+(lvl===l?'':'ghost')+'" style="margin-right:3px" '+
        'data-act="sub" data-r="'+r.id+'" data-l="'+l+'">'+l+'</button>').join('')+
      '</td><td class="right num">'+money(NEWS_COST[lvl])+'</td>'+
      '<td class="right num">'+Math.round(NEWS_QUAL[lvl]*100)+'%</td></tr>';
  });
  h += '</table><div class="hint">Stufe 0 = kein Abo. Stufe 3 liefert tagesaktuelle Meldungen — '+
       'und nur die ziehen Zuschauer von der Konkurrenz ab. Abgerechnet wird die <b>höchste Stufe des Tages</b>; '+
       'nach Sendeschluss herunterzustufen spart also nichts mehr.</div></div>';

  h += '<div class="card"><h3>Sendung ('+p.newsShow.length+'/3 Meldungen)</h3>';
  if(!p.newsShow.length) h += '<div class="empty-note">Noch keine Meldung gewählt — die Nachrichten laufen leer.</div>';
  else h += '<div class="list">'+p.newsShow.map(n=>{
    const r = RESSORTS.find(x=>x.id===n.res);
    const age = G.day-n.day;
    return '<div class="item"><div style="flex:1"><div class="t">'+r.ico+' '+esc(n.text)+'</div>'+
      '<div class="m">'+esc(r.name)+' · '+(age===0?'<span class="ok">heute</span>':age+' Tage alt')+
      ' · Nachrichtenwert '+Math.round(n.weight*100)+'</div></div>'+
      '<button class="btn sm ghost" data-act="unnews" data-i="'+n.id+'">✕</button></div>';
  }).join('')+'</div>';
  h += '</div>';

  h += '<div class="card"><h3>Eingegangene Meldungen</h3><div class="list">';
  let any = false;
  RESSORTS.forEach(r=>{
    const lvl = p.newsSub[r.id]||0;
    if(lvl===0) return;
    G.newsPool[r.id].forEach(n=>{
      if(p.newsShow.some(x=>x.id===n.id)) return;
      const age = G.day-n.day;
      if(age >= (lvl>=3?1:(lvl>=2?2:3))) return;   // niedriges Abo liefert nur ältere Meldungen
      any = true;
      h += '<div class="item"><div style="flex:1"><div class="t">'+r.ico+' '+esc(n.text)+'</div>'+
        '<div class="m">'+esc(r.name)+' · '+(age===0?'<span class="ok">heute</span>':age+' Tage alt')+
        ' · Wert '+Math.round(n.weight*100)+'</div></div>'+
        '<button class="btn sm" data-act="addnews" data-i="'+n.id+'" data-r="'+r.id+'" '+
        (p.newsShow.length>=3?'disabled':'')+'>Aufnehmen</button></div>';
    });
  });
  if(!any) h += '<div class="empty-note">Keine Meldungen. Ohne Abo kommt nichts über den Ticker.</div>';
  h += '</div></div></div>';
  return h;
};

const ACT = {

  setday(d){ viewDay = +d.d; },

    }, 'Dein Archiv ist leer. Kauf erst Lizenzen in der Filmagentur.');
  },

  pickad(d){

    const slots = getDay(p, day);

    if(slots[b].ad || slots[b].trailer) items.push({ label:'⌫ Werbeplatz leeren', sub:'nichts senden', value:{clear:true} });
    const est = estimateBlock(day,b,null);
    p.contracts.forEach(c=>{
      if(c.done >= c.spots) return;
      const reached = c.group ? est.groups[c.gi] : est.total;

        label:'📣 '+esc(c.brand)+' '+(ok?'<span class="tag g">Quote reicht</span>':'<span class="tag b">zu wenig</span>'),

        value:{ ad:c }
      });
    });

      if(items.some(x=>x.value.trail && x.value.trail.uid===s.prog.uid)) return;

        label:'🎞️ Trailer: '+esc(s.prog.title),

function bindView(){
  const activate = (n, run)=>{
    n.onclick = (ev)=>{ ev.stopPropagation(); if(n.hasAttribute('disabled')) return; run(); };
    if(n.tagName !== 'BUTTON'){
      n.onkeydown = (ev)=>{
        if(ev.key === 'Enter' || ev.key === ' '){
          ev.preventDefault(); ev.stopPropagation();
          if(!n.hasAttribute('disabled')) run();
        }
      };
    }
  };
  el('view').querySelectorAll('[data-act]').forEach(n=>{
    activate(n, ()=>{
      const fn = ACT[n.dataset.act];
      if(fn){ fn(Object.assign({}, n.dataset)); dirty = true; renderView(); renderTop(); renderBottom(); }
    });
  });
  el('view').querySelectorAll('[data-go]').forEach(n=>{
    activate(n, ()=> goFloor(+n.dataset.go));
  });
}

function serialize(){
  const s = {
    v:2, UID, day:G.day, weekday:G.weekday, week:G.week, time:G.time,
    diff:G.diff, speed:G.speed, floor:G.floor, room:G.room,
    opt:G.opt, trend:G.trend, packageTaken:!!G.packageTaken,
    market:G.market, adMarket:G.adMarket, newsPool:G.newsPool, auction:G.auction,
    events:G.events, stats:G.stats, gifts:G.gifts.map(g=>g.id),
    production:G.production ? { id:G.production.def.id, left:G.production.left, no:G.production.no } : null,
    prodNo:G._prodNo||0,
    ch: G.ch.map(c=>({
      name:c.name, isAI:c.isAI, money:c.money, credit:c.credit,
      licences:c.licences, contracts:c.contracts,
      newsSub:c.newsSub, newsSubMax:c.newsSubMax, newsShow:c.newsShow,
      star: c.star ? c.star.id : null,
      transmitters:c.transmitters, satellite:c.satellite, studio:c.studio,
      image:c.image, love:c.love, aiSkill:c.aiSkill,
      lastAud:c.lastAud, todayAud:c.todayAud, audHist:c.audHist,
      awards:c.awards, culturePoints:c.culturePoints, newsPoints:c.newsPoints,
      primePoints:c.primePoints, lowImageDays:c.lowImageDays,
      sched: Object.keys(c.sched).reduce((o,d)=>{
        o[d] = c.sched[d].map(s=>({
          p: s.prog?s.prog.uid:null, a: s.ad||null, t: s.trailer?s.trailer.uid:null,
          aired:s.aired, res:s.res
        }));
        return o;
      },{})
    }))
  };
  return JSON.stringify(s);
}

function deserialize(json){
  const s = JSON.parse(json);
  const d = DIFFS[s.diff] || DIFFS.normal;
  G = {
    diff:s.diff, D:d, day:s.day, weekday:s.weekday, week:s.week, time:s.time,
    speed:s.speed||2, paused:false, over:false, overMsg:null,
    opt: Object.assign({ timePressure:true, sound:true }, s.opt||{}),
    trend: s.trend || initTrends(),
    packageTaken: !!s.packageTaken,
    floor:s.floor||6, elevBusy:0, elevTarget:null, room:s.room||null,
    catalog: buildCatalog(),
    market:s.market, adMarket:s.adMarket, newsPool:s.newsPool, auction:s.auction,
    events:s.events, stats:s.stats,
    gifts:(s.gifts||[]).map(id=>GIFTS.find(g=>g.id===id)).filter(Boolean),
    log:[], production:null,
    player:null, ch:[], _prodNo:s.prodNo||0
  };
  UID = s.UID || 5000;
  G.ch = s.ch.map(c=>{
    const ch = makeChannel(c.name, c.isAI, c.money, c.aiSkill);
    Object.assign(ch, {
      credit:c.credit, licences:c.licences, contracts:c.contracts,
      newsSub:c.newsSub,
      newsSubMax: c.newsSubMax || Object.assign({}, c.newsSub),
      star: c.star ? STARS.find(x=>x.id===c.star) || null : null,
      newsShow:c.newsShow, transmitters:c.transmitters,
      satellite:c.satellite, studio:c.studio, image:c.image, love:c.love,
      lastAud:c.lastAud, todayAud:c.todayAud, audHist:c.audHist, awards:c.awards,
      culturePoints:c.culturePoints, newsPoints:c.newsPoints, primePoints:c.primePoints,
      lowImageDays:c.lowImageDays
    });
    ch.sched = {};
    Object.keys(c.sched).forEach(dd=>{
      ch.sched[dd] = c.sched[dd].map(sl=>({
        prog: sl.p ? ch.licences.find(l=>l.uid===sl.p)||null : null,
        ad: sl.a || null,
        trailer: sl.t ? ch.licences.find(l=>l.uid===sl.t)||null : null,
        aired: sl.aired, res: sl.res
      }));
    });
    return ch;
  });
  G.player = G.ch[0];
  if(s.production){
    const def = PRODUCTIONS.find(p=>p.id===s.production.id);
    if(def) G.production = { def, left:s.production.left, no:s.production.no };
  }
}

function slotKey(i){ return i === 0 ? AUTOKEY : SAVEKEY + i; }
function readSlot(i){
  try{
    const j = localStorage.getItem(slotKey(i));
    if(!j) return null;
    const o = JSON.parse(j);
    return { day:o.day, week:o.week, diff:o.diff, name:(o.ch&&o.ch[0]&&o.ch[0].name)||'—',
             image:(o.ch&&o.ch[0]&&o.ch[0].image)||0, json:j };
  }catch(e){ return null; }
}
function anySave(){ for(let i=0;i<=3;i++) if(readSlot(i)) return true; return false; }

function saveGame(i){
  try{
    localStorage.setItem(slotKey(i), serialize());
    toast('good','Gespeichert', i===0 ? 'Automatisch gesichert.' : 'Spielstand '+i+' geschrieben.');
    return true;
  }catch(e){ toast('bad','Speichern fehlgeschlagen','Der Browser lässt keinen Speicherplatz zu.'); return false; }
}
function autosave(){ try{ localStorage.setItem(AUTOKEY, serialize()); }catch(e){} }

function loadSlot(i){
  const s = readSlot(i);
  if(!s) return false;
  try{
    deserialize(s.json);
    el('start').style.display = 'none';
    startLoop(); dirty = true; renderAll();
    toast('good','Geladen','Tag '+G.day+', '+hhmm(G.time)+' — weiter geht die Sendung.');
    return true;
  }catch(e){ toast('bad','Spielstand beschädigt','Dieser Slot lässt sich nicht laden.'); return false; }
}

function slotLabel(i){
  const s = readSlot(i);
  const nm = i===0 ? 'Automatisch' : 'Slot '+i;
  if(!s) return nm+' · <span class="dim">leer</span>';
  return nm+' · '+esc(s.name)+' · Tag '+s.day+' · '+Math.round(s.image)+'% · '+
         (DIFFS[s.diff]?DIFFS[s.diff].name:'—');
}

function saveMenu(){
  const items = [1,2,3].map(i=>({
    label:'💾 '+slotLabel(i), sub: readSlot(i) ? 'wird überschrieben' : 'freier Platz', value:i
  }));
  chooser('Spielstand speichern','Menü','💾', items, i=>{ saveGame(i); G.paused=false; renderTop(); });
}
function loadMenu(){
  const items = [];
  for(let i=0;i<=3;i++) if(readSlot(i)) items.push({ label:(i===0?'⏱️ ':'💾 ')+slotLabel(i), sub:'laden', value:i });
  chooser('Spielstand laden','Menü','📂', items, i=>{ loadSlot(i); }, 'Es ist noch kein Spielstand vorhanden.');
}

function saveOpts(){
  try{ localStorage.setItem(OPTKEY, JSON.stringify(G.opt)); }catch(e){}
}
function loadOpts(){
  try{ const j = localStorage.getItem(OPTKEY); return j ? JSON.parse(j) : null; }catch(e){ return null; }
}

function optionsMenu(){
  const row = (key, t, d) =>
    '<div class="optline"><div><div class="ot">'+t+'</div><div class="od">'+d+'</div></div>'+
    '<button class="toggle'+(G.opt[key]?' on':'')+'" data-opt="'+key+'" role="switch" '+
    'aria-checked="'+(!!G.opt[key])+'" aria-label="'+esc(t)+'"><i></i></button></div>';
  modalStack.push({
    ico:'⚙️', title:'Einstellungen', who:'Menü', pause:true,
    html: row('timePressure','Echtzeitdruck',
              'Auswahldialoge halten die Uhr nicht an, der Fahrstuhl kostet volle Fahrzeit.')+
          row('sound','Ton','Kurze Signale bei Sendestart, Werbeerlös und Quotenalarm.'),
    buttons:[{t:'Fertig',cls:'btn',fn:()=>{ saveOpts(); G.paused=false; renderTop(); }}],
    onShow:(box)=>{
      box.querySelectorAll('[data-opt]').forEach(n=>{
        n.onclick = ()=>{
          const k = n.dataset.opt;
          G.opt[k] = !G.opt[k];
          n.classList.toggle('on', G.opt[k]);
          n.setAttribute('aria-checked', String(!!G.opt[k]));
          if(k==='sound' && G.opt.sound) sfx('buy');
          saveOpts();
        };
      });
    }
  });
  if(!modalOpen) showNextModal();
}

function openMenu(){
  G.paused = true;
  modal('☰','Pause','Menü',
    '<span class="dim">Tag '+G.day+' · '+WEEKDAYS[G.weekday]+' · '+hhmm(G.time)+' · '+
    esc(G.player.name)+' · '+G.player.image.toFixed(1).replace('.',',')+'%</span>',
    [
      {t:'Weiter',cls:'btn',fn:()=>{ G.paused=false; renderTop(); }},
      {t:'Speichern',cls:'btn ghost',fn:saveMenu},
      {t:'Laden',cls:'btn ghost',fn:loadMenu},
      {t:'Einstellungen',cls:'btn ghost',fn:optionsMenu},
      {t:'Regeln',cls:'btn ghost',fn:()=>{ showRules(); }},
      {t:'Neues Spiel',cls:'btn danger',fn:()=>{ el('start').style.display='flex'; showStart(); }}
    ]);
}

function showRules(){
  modal('📖','Spielregeln','Handbuch',
    '<b>Ziel:</b> '+G.D.winImage+'% Marktanteil <i>und</i> '+G.D.winImage+' Zuneigungspunkte bei Betty Botterbloom.<br><br>'+
    '<b>Der Tag:</b> 17:00 bis 01:00. Ab 18:00 laufen sieben Sendeblöcke — je 4 Minuten Nachrichten, dann die Sendung, '+
    'dann 5 Minuten Werbung. Was zur vollen Stunde nicht im Plan steht, wird zum Testbild.<br><br>'+
    '<b>Geld:</b> kommt ausschließlich aus Werbeverträgen. Ein Spot zahlt nur, wenn der Block die Mindestquote erreicht. '+
    'Verfällt ein Vertrag, wird die Strafe fällig.<br><br>'+
    '<b>Quote:</b> hängt an Genre, Zielgruppe zur Sendezeit, Frische des Titels, deinen Nachrichten, Trailern, '+
    'dem Zuschauerfluss, der Genre-Konjunktur und dem, was die Konkurrenz gerade sendet. '+
    'Klick nach der Sendung auf einen gelaufenen Sendeplatz — dort steht, welche Zielgruppe eingeschaltet hat.<br><br>'+
    '<b>Serien</b> binden ihr Publikum an einen festen Sendeplatz: gleiche Uhrzeit wie zuletzt bringt Zuschauer, '+
    'Herumspringen kostet sie.<br><br>'+
    '<b>Betty:</b> Ihre Zuneigung kann dein Image nie überflügeln. Kultursendungen und Geschenke bringen Punkte — '+
    'aber ohne Quote bleibt sie kühl.<br><br>'+
    '<b>Gefahr:</b> Drei Tage unter '+G.D.fireImage+'% Marktanteil und Herr Raffer wirft dich raus. '+
    'Filme ab 18 vor 22 Uhr rufen den Gerichtsvollzieher.<br><br>'+
    '<b>Zeit:</b> Bei aktivem Echtzeitdruck läuft die Uhr auch während der Programmauswahl weiter, und jede '+
    'Fahrstuhlfahrt kostet Sendetag. Im Menü unter Einstellungen lässt sich das abschalten.',
    [{t:'Alles klar',cls:'btn',fn:()=>{ G.paused=false; renderTop(); }}]);
}

function showEnd(){
  const m = G.overMsg;
  const p = G.player;
  el('start').style.display = 'flex';
  el('start').innerHTML =
    '<div class="sbox">'+
      '<div style="font-size:62px">'+m.ico+'</div>'+
      '<h1 style="font-size:32px;margin-top:6px">'+esc(m.title)+'</h1>'+
      '<p class="sub" style="max-width:440px;margin:10px auto 20px">'+m.text+'</p>'+
      '<div class="grid3" style="max-width:460px;margin:0 auto 18px">'+
        '<div class="kpi"><div class="k">Marktanteil</div><div class="v">'+p.image.toFixed(1).replace('.',',')+'%</div></div>'+
        '<div class="kpi"><div class="k">Betty</div><div class="v" style="color:var(--love)">'+Math.round(p.love)+'</div></div>'+
        '<div class="kpi"><div class="k">Konto</div><div class="v">'+moneyShort(p.money)+'</div></div>'+
      '</div>'+
      '<button class="go" id="againbtn">Neues Spiel</button>'+
    '</div>';
  el('againbtn').onclick = showStart;
}

/* ─── Startbildschirm ─── */
let startDiff = 'normal';
let startOpt = Object.assign({ timePressure:true, sound:true }, loadOpts()||{});
function showStart(){
  if(tickTimer) clearInterval(tickTimer);
  el('start').style.display = 'flex';
  el('start').innerHTML =
    '<div class="sbox">'+
      '<h1>MAD<span>TV</span></h1>'+
      '<div class="sub">Der Sendermanager · eine Hommage an den Klassiker von 1991</div>'+
      '<div class="lbl">Name deines Senders</div>'+
      '<input type="text" id="chname" maxlength="18" value="Mad TV" aria-label="Name deines Senders">'+
      '<div class="lbl" style="margin-top:18px">Schwierigkeit</div>'+
      '<div class="optrow" id="diffrow">'+
        Object.keys(DIFFS).map(k=>'<button class="opt '+(startDiff===k?'on':'')+'" data-d="'+k+'" '+
          'aria-pressed="'+(startDiff===k)+'">'+
          DIFFS[k].ico+' '+DIFFS[k].name+'<small>'+DIFFS[k].desc+' Sieg ab '+DIFFS[k].winImage+'%</small></button>').join('')+
      '</div>'+
      '<div class="lbl" style="margin-top:14px">Einstellungen</div>'+
      '<div class="optrow" id="optrow">'+
        '<button class="opt '+(startOpt.timePressure?'on':'')+'" data-o="timePressure" '+
          'aria-pressed="'+startOpt.timePressure+'">⏱️ Echtzeitdruck'+
          '<small>'+(startOpt.timePressure?'Uhr läuft auch im Menü weiter':'Auswahl hält die Uhr an')+'</small></button>'+
        '<button class="opt '+(startOpt.sound?'on':'')+'" data-o="sound" '+
          'aria-pressed="'+startOpt.sound+'">🔊 Ton'+
          '<small>'+(startOpt.sound?'an':'aus')+'</small></button>'+
      '</div>'+
      '<button class="go" id="gobtn">Sendebetrieb aufnehmen</button>'+
      (anySave()?'<div style="margin-top:12px"><button class="opt" id="loadbtn">💾 Spielstand laden</button></div>':'')+
      '<div class="foot">Du bist neuer Programmdirektor. Fülle den Sendeplan, verkaufe Werbung, halte die Quote oben —<br>'+
      'und gewinne das Herz von Betty Botterbloom, ehe die Konkurrenz es tut.<br><br>'+
      'Eigenständige Nachbildung. Alle Titel, Marken und Personen sind frei erfunden.</div>'+
    '</div>';
  el('diffrow').querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{ startDiff = b.dataset.d; showStart(); };
  });
  el('optrow').querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{ startOpt[b.dataset.o] = !startOpt[b.dataset.o]; showStart(); };
  });
  el('gobtn').onclick = ()=>{
    const nm = (el('chname').value || 'Mad TV').trim().slice(0,18);
    newGame(nm, startDiff, startOpt);
    saveOpts();
    el('start').style.display = 'none';
    startLoop(); dirty = true; renderAll();
    intro();
  };
  const lb = el('loadbtn');
  if(lb) lb.onclick = ()=>{
    // Der Ladedialog braucht einen Spielzustand; bei Abbruch bleibt der
    // Startbildschirm sichtbar, geladen wird erst in loadSlot().
    if(!G) newGame('Mad TV', startDiff, startOpt);
    loadMenu();
  };
}

function intro(){
  modal('🧔','Willkommen im Haus','Herr Raffer',
    'Sie sind der neue Programmdirektor. Ich sage es nur einmal: Ich will Quote. '+
    'Unten steht Ihr Startkapital von '+money(G.D.money)+' — davon kaufen Sie Filme, davon bezahlen Sie Nachrichten, '+
    'und davon leben Sie, bis die Werbung Geld bringt.<br><br>'+
    'Um 18 Uhr geht der Sender auf Sendung. Was bis dahin nicht im Plan steht, ist Testbild. '+
    'Und lassen Sie die Finger von Frau Botterbloom — die ist zu schade für Sie.',
    [{t:'Ans Werk',cls:'btn',fn:()=>{
      modal('📖','Der erste Abend','Kurzanleitung',
        '1. <b>Filmagentur</b> (Etage 5): Lizenzen kaufen.<br>'+
        '2. <b>Werbeagentur</b> (Etage 6): Verträge holen — nur so kommt Geld herein.<br>'+
        '3. <b>Nachrichtenstudio</b> (Etage 8): Abos abschließen, Meldungen wählen.<br>'+
        '4. <b>Dein Büro</b> (Etage 7): Sendeplan füllen, Werbespots setzen.<br><br>'+
        'Der Fahrstuhl kostet Zeit. Plane deine Wege.',
        [{t:'Los geht\'s',cls:'btn'}]);
    }}]);
}

/* ─── Tastatur ─── */
document.addEventListener('keydown', e=>{
  if(!G || el('start').style.display !== 'none') return;
  if(e.key === 'Escape'){ if(modalOpen) closeModal(); else if(G.room) leaveRoom(); }
  if(e.key === ' '){ e.preventDefault(); G.paused = !G.paused; renderTop(); }
  const map = {'1':'office','2':'film','3':'werbe','4':'news','5':'archiv','6':'studio','7':'betty','8':'chef'};
  if(map[e.key]){ goFloor(FLOORS.findIndex(f=>f.id===map[e.key])); }
});

/* ─── Start ─── */
showStart();

</script>
